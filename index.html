<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Claw Machine</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Times New Roman", Times, serif; color: #111; background: #fff; }
    main { min-height: 100vh; display: grid; grid-template-columns: minmax(280px, .85fr) minmax(320px, 1.15fr); gap: 36px; align-items: center; width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0; }
    .entry-panel { display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0 0 4px; font-size: clamp(38px, 7vw, 78px); line-height: .92; font-weight: 700; letter-spacing: 0; }
    .hint { margin: 0 0 8px; max-width: 560px; font-size: 20px; line-height: 1.35; }
    textarea { width: 100%; min-height: 210px; resize: vertical; padding: 18px; border: 2px solid #111; border-radius: 0; font: 20px/1.38 "Times New Roman", Times, serif; color: #111; background: #fff; outline: none; }
    textarea:focus, button:focus-visible { box-shadow: 0 0 0 4px #ddd; }
    .start-button, .grab-button { width: 100%; min-height: 58px; border: 2px solid #111; border-radius: 0; font: 700 24px/1 "Times New Roman", Times, serif; color: #fff; background: #111; cursor: pointer; transition: transform 160ms ease, background 160ms ease, color 160ms ease; }
    .start-button:hover, .grab-button:hover:not(:disabled) { transform: translateY(-1px); background: #333; }
    .grab-button:disabled { color: #777; background: #e8e8e8; cursor: not-allowed; }
    .message { min-height: 30px; margin: 0; font-size: 19px; line-height: 1.3; }
    .machine-wrap { display: grid; gap: 16px; }
    .machine { position: relative; min-height: min(640px, 72vh); border: 4px solid #111; background: linear-gradient(#fff 0 0) padding-box, repeating-linear-gradient(90deg, #111 0 12px, #fff 12px 24px); overflow: hidden; }
    .machine::before { content: ""; position: absolute; inset: 18px 18px 106px; border: 3px solid #111; background: linear-gradient(90deg, rgba(0,0,0,.08) 1px, transparent 1px), linear-gradient(0deg, rgba(0,0,0,.08) 1px, transparent 1px), #fff; background-size: 32px 32px; }
    .machine-top { position: absolute; left: 18px; right: 18px; top: 18px; height: 58px; border-bottom: 3px solid #111; background: #fff; z-index: 3; }
    .rail { position: absolute; left: 28px; right: 28px; top: 45px; height: 8px; background: #111; }
    .claw { position: absolute; left: 50%; top: 44px; width: 98px; height: 162px; transform: translateX(-50%); transform-origin: top center; z-index: 4; transition: top 520ms ease-in-out, transform 520ms ease-in-out; }
    .claw.grabbing { top: 218px; transform: translateX(-50%) scaleY(1.04); }
    .cable { position: absolute; left: 46px; top: 0; width: 6px; height: 95px; background: #111; }
    .joint { position: absolute; left: 31px; top: 86px; width: 36px; height: 28px; border: 3px solid #111; background: #fff; }
    .finger { position: absolute; top: 107px; width: 35px; height: 58px; border: 5px solid #111; border-top: 0; background: transparent; }
    .finger.left { left: 18px; border-right: 0; transform: rotate(24deg); transform-origin: top right; }
    .finger.right { right: 18px; border-left: 0; transform: rotate(-24deg); transform-origin: top left; }
    .bin { position: absolute; left: 18px; right: 18px; bottom: 18px; height: 116px; border-top: 4px solid #111; background: linear-gradient(180deg, transparent, rgba(0,0,0,.04)), #fff; z-index: 2; }
    .balls { position: absolute; left: 34px; right: 34px; bottom: 96px; height: 260px; z-index: 3; }
    .ball { position: absolute; display: grid; place-items: center; width: var(--size); height: var(--size); left: var(--x); bottom: var(--y); border: 3px solid #111; border-radius: 50%; font-size: calc(var(--size) * .56); font-weight: 700; line-height: 1; color: #fff; background: radial-gradient(circle at 32% 25%, #333 0 12%, #111 32%, #000 68%); box-shadow: inset -8px -10px 0 rgba(255,255,255,.08); transition: opacity 260ms ease, transform 260ms ease; animation: settle 650ms ease both; }
    .ball.removing { opacity: 0; transform: translateY(-96px) scale(.56); }
    @keyframes settle { from { transform: translateY(-70px) rotate(-18deg); opacity: 0; } to { transform: translateY(0) rotate(0); opacity: 1; } }
    .prize-door { position: absolute; right: 38px; bottom: 40px; width: 150px; height: 54px; display: grid; place-items: center; border: 3px solid #111; background: #fff; font-size: 21px; font-weight: 700; z-index: 5; }
    .reveal { min-height: 112px; padding: 18px; border: 2px solid #111; font-size: 22px; line-height: 1.25; background: #fff; }
    .reveal-title { display: block; margin-bottom: 6px; font-size: 17px; font-weight: 700; text-transform: uppercase; }
    .task-name { display: block; overflow-wrap: anywhere; font-size: 30px; font-weight: 700; }
    .task-date { display: block; margin-top: 6px; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; gap: 24px; align-items: start; padding: 24px 0; } .machine { min-height: 560px; } }
  </style>
</head>
<body>
  <main>
    <section class="entry-panel" aria-label="Task entry">
      <h1>Task Claw Machine</h1>
      <p class="hint">Enter one task per line with a due date, then start the machine.</p>
      <textarea id="taskInput" spellcheck="false">Pay electricity bill - 2026-07-02
Send project notes - 2026-07-01
Book dentist appointment - 2026-07-12
Return library books - 2026-06-30</textarea>
      <button class="start-button" id="startButton" type="button">Start</button>
      <p class="message" id="message" aria-live="polite"></p>
    </section>
    <section class="machine-wrap" aria-label="Claw machine">
      <div class="machine">
        <div class="machine-top"><div class="rail"></div></div>
        <div class="claw" id="claw" aria-hidden="true"><div class="cable"></div><div class="joint"></div><div class="finger left"></div><div class="finger right"></div></div>
        <div class="balls" id="balls" aria-hidden="true"></div>
        <div class="bin"></div><div class="prize-door">Prize Slot</div>
      </div>
      <button class="grab-button" id="grabButton" type="button" disabled>Grab a Ball</button>
      <div class="reveal" id="reveal" aria-live="polite"><span class="reveal-title">Hidden Task</span><span>Start the machine, then grab a ball.</span></div>
    </section>
  </main>
  <script>
    const taskInput = document.querySelector("#taskInput");
    const startButton = document.querySelector("#startButton");
    const grabButton = document.querySelector("#grabButton");
    const ballsEl = document.querySelector("#balls");
    const revealEl = document.querySelector("#reveal");
    const messageEl = document.querySelector("#message");
    const clawEl = document.querySelector("#claw");
    let tasks = [];
    let grabbing = false;
    const layouts = [
      { x: "8%", y: "0px", size: "78px" }, { x: "30%", y: "4px", size: "86px" }, { x: "55%", y: "2px", size: "74px" }, { x: "74%", y: "8px", size: "84px" },
      { x: "18%", y: "72px", size: "82px" }, { x: "43%", y: "78px", size: "90px" }, { x: "66%", y: "78px", size: "78px" }, { x: "4%", y: "142px", size: "72px" },
      { x: "28%", y: "152px", size: "78px" }, { x: "52%", y: "150px", size: "86px" }, { x: "76%", y: "148px", size: "74px" }, { x: "14%", y: "214px", size: "70px" },
      { x: "40%", y: "222px", size: "76px" }, { x: "68%", y: "218px", size: "72px" }
    ];
    function parseDate(value) { const timestamp = Date.parse(value.trim()); return Number.isNaN(timestamp) ? null : new Date(timestamp); }
    function formatDueDate(date) { return new Intl.DateTimeFormat("en", { month: "long", day: "numeric", year: "numeric" }).format(date); }
    function parseTasks(text) {
      return text.split(/\n+/).map((line) => line.trim()).filter(Boolean).map((line) => {
        const match = line.match(/^(.*?)\s*(?:-|,|\|)\s*(\d{4}-\d{1,2}-\d{1,2}|[A-Za-z]+\s+\d{1,2},?\s+\d{4})$/);
        if (!match) return null;
        const dueDate = parseDate(match[2]);
        if (!dueDate) return null;
        return { name: match[1].trim(), dueDate };
      }).filter((task) => task && task.name).sort((a, b) => a.dueDate - b.dueDate);
    }
    function renderBalls() {
      ballsEl.innerHTML = "";
      tasks.forEach((task, index) => {
        const layout = layouts[index % layouts.length];
        const ball = document.createElement("div");
        ball.className = "ball";
        ball.textContent = "?";
        ball.style.setProperty("--x", layout.x);
        ball.style.setProperty("--y", layout.y);
        ball.style.setProperty("--size", layout.size);
        ball.style.animationDelay = `${Math.min(index * 58, 460)}ms`;
        ballsEl.appendChild(ball);
      });
    }
    function setReveal(content) { revealEl.innerHTML = content; }
    startButton.addEventListener("click", () => {
      tasks = parseTasks(taskInput.value);
      renderBalls();
      if (!tasks.length) {
        grabButton.disabled = true;
        messageEl.textContent = "Use one task per line, like: File taxes - 2026-07-01";
        setReveal("<span class=\"reveal-title\">Hidden Task</span><span>No valid tasks yet.</span>");
        return;
      }
      grabButton.disabled = false;
      messageEl.textContent = `${tasks.length} hidden task${tasks.length === 1 ? "" : "s"} loaded.`;
      setReveal("<span class=\"reveal-title\">Hidden Task</span><span>The soonest task is waiting inside a ball.</span>");
    });
    grabButton.addEventListener("click", () => {
      if (grabbing || !tasks.length) return;
      grabbing = true;
      grabButton.disabled = true;
      clawEl.classList.add("grabbing");
      messageEl.textContent = "The claw is choosing the soonest due date.";
      window.setTimeout(() => {
        const nextTask = tasks.shift();
        const firstBall = ballsEl.querySelector(".ball");
        if (firstBall) firstBall.classList.add("removing");
        setReveal(`<span class="reveal-title">Revealed Task</span><span class="task-name">${escapeHtml(nextTask.name)}</span><span class="task-date">Due ${formatDueDate(nextTask.dueDate)}</span>`);
        window.setTimeout(() => {
          renderBalls();
          clawEl.classList.remove("grabbing");
          grabbing = false;
          grabButton.disabled = tasks.length === 0;
          messageEl.textContent = tasks.length ? `${tasks.length} hidden task${tasks.length === 1 ? "" : "s"} remain.` : "All tasks have been revealed.";
        }, 360);
      }, 760);
    });
    function escapeHtml(value) { return value.replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" }[character])); }
  </script>
</body>
</html>
